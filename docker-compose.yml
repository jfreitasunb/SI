# Rotacao dos logs do Docker: sem isso o log JSON cresce sem limite
# (um loop de avisos do PHP ja encheu o disco com 9 GB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  pg_data:
  pgadmin_data:

services:
  # Web Server Service
  nginx:
    logging: *default-logging
    image: nginx:alpine
    restart: unless-stopped
    container_name: nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
      - db
      
  db:
    logging: *default-logging
    container_name: db
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-si}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-si}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  init-pgadmin:
    logging: *default-logging
    image: dpage/pgadmin4:latest
    user: root
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-si}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-jota@pgadmin.org}
    # O pgAdmin guarda os arquivos de cada usuario em storage/<email com @ trocado por _>.
    # O pgpass vale para qualquer banco (*), para que o servidor "si (admin)", que se
    # conecta pelo banco postgres, consiga apagar/recriar o banco si.
    entrypoint:
      - sh
      - -c
      - |
        dir=/var/lib/pgadmin/storage/$$(echo "$$PGADMIN_DEFAULT_EMAIL" | tr '@' '_')
        mkdir -p "$$dir"
        printf 'db:5432:*:%s:%s\n' "$$POSTGRES_USER" "$$POSTGRES_PASSWORD" > "$$dir/pgpass"
        chmod 600 "$$dir/pgpass"
        chown -R pgadmin /var/lib/pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  pgadmin:
    logging: *default-logging
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-jota@pgadmin.org}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?defina PGADMIN_DEFAULT_PASSWORD no arquivo .env}
      - PGADMIN_CONFIG_SERVER_MODE=True
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      init-pgadmin:
        condition: service_completed_successfully

  # Application Service
  app:
    logging: *default-logging
    container_name: si
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    working_dir: /var/www
    environment:
      # URLs usadas por conf/default.php (o nginx serve a raiz do projeto)
      - SI_ROOT_MAIN=http://localhost:8080/
      - SI_SITE=http://localhost:8080/
    depends_on:
      - db

  mailhog:
    logging: *default-logging
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"