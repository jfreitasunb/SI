server {
    listen 80;
    server_name localhost;

    root /var/www;
    index index.php index.htm index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server_tokens off;

    # Cabecalhos de seguranca HTTP (SAMEORIGIN preserva o frameset do SI).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O nginx NAO le os .htaccess do projeto: as regras abaixo reproduzem
    # as protecoes que eles fazem no Apache.

    # Arquivos e pastas ocultos (.git, .env, .htaccess...).
    location ~ /\. {
        deny all;
    }

    # Dumps de banco, logs/auxiliares do LaTeX, backups, docs internos e arquivos de infraestrutura.
    location ~* (\.(sql|log|aux|bak|old|orig|swp|zip|md)|/Dockerfile|/docker-compose\.ya?ml|/banco_dado_admin)$ {
        deny all;
    }

    # Credenciais do banco.
    location ~* ^/global/db_config.*\.php$ {
        deny all;
    }

    # Pastas internas, ferramentas CLI, migracoes, uploads e codigo desativado (case-insensitive).
    location ~* ^/(conf|docker|tools|sql|telas|muda_senha|modules/(account|usuario|servidor_admin)/modelo_tex|modules/servidor_admin/(Tex|inclusao_de_com_copia|anexos)|modules/usuario/utilidades|modules/oferta_atualizacao/listas_SAA|modules/lista_oferta/(model|modelController|viewController|processing|utils|conf|template))(/|$) {
        deny all;
    }

    # Configuracoes de rede geradas (.txt), arquivos residuais de oferta_atualizacao e scripts internos.
    location ~* ^/(modules/(gerencia_rede|redes)/.*\.txt|modules/oferta_atualizacao/(a\.txt|eq|array_linha\.txt|recupera_lista_SAA_2\.php)|modules/lista_oferta/scripts/migrationScript\.php)$ {
        deny all;
    }

    # Revalida CSS/JS via ETag/Last-Modified evitando cache heuristico antigo no navegador.
    location ~* \.(css|js)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Distribuicao automatica da LO: roda milhares de tentativas e pode levar minutos.
    # Timeout maior so aqui (casa com set_time_limit(600) no proprio script).
    location = /modules/lista_oferta/scripts/offerListScript.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600s;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
