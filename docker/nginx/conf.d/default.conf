server {
    listen 80;
    server_name localhost;

    root /var/www;
    index index.php index.htm index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server_tokens off;

    # O nginx NAO le os .htaccess do projeto: as regras abaixo reproduzem
    # as protecoes que eles fazem no Apache.

    # Arquivos e pastas ocultos (.git, .env, .htaccess...).
    location ~ /\. {
        deny all;
    }

    # Dumps de banco, logs/auxiliares do LaTeX, backups e arquivos de infraestrutura.
    location ~* (\.(sql|log|aux|bak|old|orig|swp|zip)|/Dockerfile|/docker-compose\.ya?ml|/banco_dado_admin)$ {
        deny all;
    }

    # Credenciais do banco.
    location ~* ^/global/db_config.*\.php$ {
        deny all;
    }

    # Pastas lidas apenas pelo PHP/pdflatex ou codigo desativado (Require all denied no Apache).
    # anexos/: servidos apenas via modules/servidor_admin/baixa_anexo.php (exige login).
    location ~ ^/(conf|docker|muda_senha|modules/(account|usuario|servidor_admin)/modelo_tex|modules/servidor_admin/(Tex|inclusao_de_com_copia|anexos)|modules/usuario/utilidades)(/|$) {
        deny all;
    }

    # Pasta de upload: nunca executar nem servir scripts.
    location ~* ^/modules/oferta_atualizacao/listas_SAA/.*\.(php|phtml|php[0-9]|phps|phar|cgi|pl|py|asp|aspx|jsp|sh)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
